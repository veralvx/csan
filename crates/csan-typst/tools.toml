# The tools the Typst package's harness (crates/csan-typst/justfile) runs, at the versions
# flake.nix provides: nixpkgs' (flake.lock), and typst-package-check's own flake, at its tag.
# `nix flake check` fails when one moves (`pins`), naming it; `just typst tools-check` holds the
# ones on PATH to these.
typst = "0.15.1"
tytanic = "0.4.1"
typstyle = "0.15.1"
typst-package-check = "0.7.0"
tinymist = "0.15.10"
just = "1.58.0"
shellcheck = "0.11.0"
shfmt = "3.14.1"
actionlint = "1.7.12"

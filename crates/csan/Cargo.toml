[package]
name = "csan"
version.workspace = true
authors.workspace = true
categories = [
  "command-line-utilities",
  "command-line-interface",
  "text-processing",
]
documentation = "https://docs.rs/csan"
edition.workspace = true
keywords.workspace = true
license.workspace = true
readme.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Command-line Cutter call number generator (Cutter-Sanborn and Library of Congress)"

[lints]
workspace = true

[[bin]]
name = "csan"
path = "src/main.rs"
# The binary is a thin shell over the library; skipping its rustdoc also
# avoids the doc output-filename collision with this package's own `csan`
# lib target (rust-lang/cargo#6313).
doc = false

[dependencies]
clap = { workspace = true }
csan-core = { workspace = true }
serde_json = { workspace = true }

[package.metadata.dist]
dist = true

# `cargo binstall csan` downloads the release archive dist builds for the
# host instead of compiling. The Unix archives are .tar.xz with the files in
# a `csan-<target>/` directory; the Windows ones are .zip with them at the
# root.
[package.metadata.binstall]
pkg-url = "https://github.com/veralvx/{ name }/releases/download/v{ version }/{ name }-{ target }.tar.xz"
bin-dir = "{ name }-{ target }/{ bin }{ binary-ext }"
pkg-fmt = "txz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-url = "https://github.com/veralvx/{ name }/releases/download/v{ version }/{ name }-{ target }.zip"
bin-dir = "{ bin }{ binary-ext }"
pkg-fmt = "zip"

[package.metadata.binstall.overrides.aarch64-pc-windows-msvc]
pkg-url = "https://github.com/veralvx/{ name }/releases/download/v{ version }/{ name }-{ target }.zip"
bin-dir = "{ bin }{ binary-ext }"
pkg-fmt = "zip"

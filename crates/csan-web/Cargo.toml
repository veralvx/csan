[package]
name = "csan-web"
version.workspace = true
authors.workspace = true
edition.workspace = true
# wasm-pack copies these into the npm package.json (the workspace list is
# Rust/Typst-oriented).
keywords = ["cutter", "cutter-sanborn", "cataloging", "call-number", "library"]
license.workspace = true
publish = false
repository.workspace = true
rust-version.workspace = true
description = "Cutter call number generation for JavaScript via WebAssembly"

[lib]
crate-type = ["cdylib", "rlib"]

[lints]
workspace = true

[dependencies]
csan-core = { workspace = true }
serde = { workspace = true }
serde-wasm-bindgen = { workspace = true }
wasm-bindgen = { workspace = true }

[dev-dependencies]
js-sys = { workspace = true }
wasm-bindgen-test = { workspace = true }

[package.metadata.dist]
dist = false

# Rust >= 1.87 emits bulk-memory, nontrapping-float-to-int, sign-ext, and
# mutable-globals for wasm32-unknown-unknown by default, but wasm-pack's
# pinned binaryen validates with only the MVP feature set and rejects the
# module. Enable exactly those features (the same set as `just wasm-opt`).
[package.metadata.wasm-pack.profile.release]
wasm-opt = [
  "-O",
  "--enable-bulk-memory",
  "--enable-nontrapping-float-to-int",
  "--enable-sign-ext",
  "--enable-mutable-globals",
]

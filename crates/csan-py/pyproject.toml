[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "csan"
description = "Cutter call numbers for library cataloging (Cutter-Sanborn and Library of Congress)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT OR Apache-2.0" }
authors = [{ name = "VERALVX", email = "veralvx@veralvx.com" }]
keywords = ["cutter", "cutter-sanborn", "library", "cataloging"]
classifiers = [
  "Programming Language :: Rust",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: Implementation :: CPython",
  "Topic :: Text Processing",
]
dynamic = ["version"]

[project.urls]
Repository = "https://github.com/veralvx/csan"

[project.scripts]
csan = "csan:main"

[tool.maturin]
python-source = "python"
module-name = "csan._csan"

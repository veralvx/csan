version: 2
updates:
  # ─── Rust (Cargo) ───────────────────────────────────────────────
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "06:00"
      timezone: "UTC"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore"
      include: "scope"
    labels:
      - "dependencies"
      - "rust"
    groups:
      # Minor and patch updates are batched into a single PR.
      # Major updates are left ungrouped for individual review.
      rust-dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    cooldown:
      default-days: 3

  # ─── Ruby (the gem's development tools, crates/csan-rb) ───────────
  # The gem's runtime dependency (rb_sys) is a gemspec range; Bundler's lock
  # pins the tools around it (rake, rake-compiler, minitest, standard).
  - package-ecosystem: "bundler"
    directory: "/crates/csan-rb"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "06:30"
      timezone: "UTC"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
      include: "scope"
    labels:
      - "dependencies"
      - "ruby"
    groups:
      ruby-dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    cooldown:
      default-days: 3

  # ─── GitHub Actions ─────────────────────────────────────────────
  - package-ecosystem: "github-actions"
    directory: "/"
    # release.yml is generated by dist (`dist generate`), whose Release
    # workflow plan job fails when the file differs from what the pinned
    # dist version generates: its actions move with `cargo-dist-version` in
    # dist-workspace.toml, never by hand
    exclude-paths:
      - ".github/workflows/release.yml"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "07:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
      include: "scope"
    labels:
      - "dependencies"
      - "actions"
    groups:
      actions-dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    cooldown:
      default-days: 3

  # ─── Nix (flake.lock) ───────────────────────────────────────────
  # nixpkgs and rust-overlay move by commit, not by version: one grouped
  # pull request a week, auto-merged once nix.yml's checks pass
  # (dependabot-automerge.yml). The 3-day cooldown keeps it off a
  # nixos-unstable commit younger than that. No `labels`: Dependabot's
  # defaults for this ecosystem are `dependencies` and `nix`, and it
  # creates those itself, where a configured label the repository lacks
  # is dropped.
  - package-ecosystem: "nix"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "08:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      nix-dependencies:
        patterns:
          - "*"
    cooldown:
      default-days: 3

name: Dependency Review

on:
  # every pull request, whatever it touches: a required check that never
  # reports blocks the merge
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  dependency-review:
    name: License & Security Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Dependency Review
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: moderate
          # audit your current dependency licenses:
          #   cargo tree --format "{p} {l}" | sort -u
          allow-licenses: >
            0BSD, Apache-2.0, BlueOak-1.0.0, BSD-2-Clause, BSD-3-Clause,
            BSL-1.0, CC0-1.0, CC-BY-4.0, ISC, MIT, MIT-0, MPL-2.0,
            OpenSSL, Unicode-3.0, Unicode-DFS-2016, Unlicense, Zlib
          # The Ruby gem's development tools (crates/csan-rb/Gemfile.lock,
          # through standard's rubocop) include Ruby's own default gems,
          # under the Ruby License (`json`), or it or BSD-2-Clause (`drb`,
          # `racc`): permissive, and never shipped in the gem. `rb_sys`
          # (which builds the source gem's extension) is MIT and Apache-2.0,
          # as its gemspec lists them, but GitHub's dependency graph joins
          # the two into an unknown `LicenseRef-bad-mit-apache-2.0`.
          allow-dependencies-licenses: >
            pkg:gem/json, pkg:gem/drb, pkg:gem/racc, pkg:gem/rb_sys
          comment-summary-in-pr: on-failure

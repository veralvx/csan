# Publishes the Node package to npm as @veralvx/csan for each release:
# `just release` pushes the tag, the Release workflow builds and
# smoke-tests the package (`just npm-pack`, see release-extra-artifacts.yml)
# and attaches it to the GitHub Release, and this workflow waits for that
# release to succeed, then publishes exactly that tarball.
#
# It runs on the tag push itself, not on `workflow_run`, so the OIDC token
# comes from a `push` (or `workflow_dispatch`) event, which every trusted
# publishing registry accepts.
#
# Authentication is npm trusted publishing (OIDC), with an NPM_TOKEN
# repository secret as a fallback. One-time setup:
#   1. npmjs.com → package @veralvx/csan → Settings → Trusted publishing →
#      GitHub Actions: owner `veralvx`, repository `csan`, workflow
#      `publish-npm.yml`, environment `npm`.
#   2. GitHub → Settings → Environments → `npm` (optionally with required
#      reviewers). If it restricts deployment branches and tags, allow the
#      tags `v*` (release runs) and `main` (manual runs).
#
# To (re)publish a release by hand, run it from the Actions tab with the
# release tag; a version already on npm is skipped.
name: Publish to npm

on:
  push:
    # Release tags only (prereleases such as v1.0.0-rc.1 do not match).
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish (e.g. v1.2.3)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  # Keep in sync with NPM_PACKAGE in the justfile.
  PACKAGE: "@veralvx/csan"

jobs:
  release:
    name: Wait for the release
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      actions: read # find and watch the Release run
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.tag.outputs.version }}
      missing: ${{ steps.registry.outputs.missing }}
    steps:
      - name: Resolve the release tag
        id: tag
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::'$TAG' is not a release tag (vX.Y.Z)"
            exit 1
          fi
          {
            echo "tag=$TAG"
            echo "version=${TAG#v}"
          } >> "$GITHUB_OUTPUT"

      - name: Check whether this version is already on npm
        id: registry
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          status="$(curl -sS -o /dev/null -w '%{http_code}' \
            "https://registry.npmjs.org/${PACKAGE/\//%2f}/$VERSION")"
          case "$status" in
            200)
              echo "::notice::$PACKAGE@$VERSION is already on npm; nothing to publish."
              echo "missing=false" >> "$GITHUB_OUTPUT" ;;
            404) echo "missing=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::npm registry returned HTTP $status"; exit 1 ;;
          esac

      # The tag push starts the Release workflow and this one together; the
      # package is only published once that release has succeeded.
      - name: Wait for the Release workflow to succeed
        if: steps.registry.outputs.missing == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          for _ in $(seq 30); do
            run_id="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow release.yml \
              --branch "$TAG" --event push --limit 1 --json databaseId --jq '.[0].databaseId')"
            [ -n "$run_id" ] && break
            sleep 20
          done
          if [ -z "$run_id" ]; then
            echo "::error::no Release run found for $TAG"
            exit 1
          fi
          echo "Waiting for Release run $run_id"
          if ! gh run watch "$run_id" --repo "$GITHUB_REPOSITORY" --exit-status --interval 30 > /dev/null; then
            echo "::error::the Release run for $TAG did not succeed; nothing was published"
            exit 1
          fi

  publish:
    name: Publish @veralvx/csan
    needs: release
    if: needs.release.outputs.missing == 'true'
    runs-on: ubuntu-latest
    environment:
      name: npm
      url: https://www.npmjs.com/package/@veralvx/csan
    permissions:
      contents: read # download the release assets
      id-token: write # npm trusted publishing and provenance
    steps:
      - name: Download the package from the GitHub Release
        id: tarball
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release.outputs.tag }}
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          # `npm pack` names a scoped package's tarball <scope>-<name>-<version>.tgz.
          file="veralvx-csan-$VERSION.tgz"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir dist \
            --pattern "$file" --pattern "$file.sha256"
          (cd dist && sha256sum -c "$file.sha256")
          # Refuse a tarball whose manifest is not this package and version.
          tar -xzOf "dist/$file" package/package.json \
            | jq -e --arg name "$PACKAGE" --arg version "$VERSION" \
              '.name == $name and .version == $version' > /dev/null \
            || { echo "::error::dist/$file is not $PACKAGE@$VERSION"; exit 1; }
          # The ./ matters: npm reads `dist/<file>` as a GitHub `owner/repo`.
          echo "path=./dist/$file" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm >= 11.5.1.
      - name: Update npm
        run: npm install -g "npm@^11.5.1" && npm --version

      - name: Publish
        env:
          # Empty unless the fallback secret is set; npm then authenticates
          # through trusted publishing.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          TARBALL: ${{ steps.tarball.outputs.path }}
        run: npm publish "$TARBALL" --access public --provenance
